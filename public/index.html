<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="PTTConnect push-to-talk webapp">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>PTTConnect</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PUSH TO TALK</p>
        <h1>PTTConnect</h1>
      </div>
      <div id="connectionBadge" class="badge badge-offline">Offline</div>
    </header>

    <section class="card join-card" id="joinPanel">
      <label for="name">Naam</label>
      <input id="name" maxlength="32" autocomplete="nickname" placeholder="Jouw naam">

      <label for="room">Kamercode</label>
      <div class="room-row">
        <input id="room" maxlength="32" value="PTT001" autocomplete="off">
        <button id="randomRoom" class="secondary" type="button">Nieuw</button>
      </div>

      <button id="joinButton" class="primary" type="button">Verbinden</button>
      <p class="help">De browser vraagt één keer toestemming voor je microfoon.</p>
    </section>

    <section class="card radio-card hidden" id="radioPanel">
      <div class="room-info">
        <div>
          <span class="label">Kamer</span>
          <strong id="roomLabel">-</strong>
        </div>
        <button id="copyLink" class="secondary" type="button">Deellink kopiëren</button>
      </div>

      <div id="speakerStatus" class="speaker-status">Kanaal vrij</div>

      <button id="pttButton" class="ptt" type="button" disabled>
        <span class="ptt-icon">🎙️</span>
        <span class="ptt-main">HOUD INGEDRUKT</span>
        <span class="ptt-sub">OM TE PRATEN</span>
      </button>

      <p class="keyboard-help">Op laptop werkt ook de <kbd>spatiebalk</kbd>.</p>

      <div class="participants-block">
        <div class="participants-heading">
          <h2>Deelnemers</h2>
          <span id="participantCount">0</span>
        </div>
        <div id="participants" class="participants"></div>
      </div>

      <button id="leaveButton" class="danger" type="button">Verbinding verbreken</button>
    </section>

    <p id="notice" class="notice" aria-live="polite"></p>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
