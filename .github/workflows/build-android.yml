name: Build PTTConnect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-android.yml"
      - "pttconnect/**"
      - "README.md"
      - "NOTICE"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out PTTConnect overlay
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Check out pinned TS3 Android base
        shell: bash
        run: |
          rm -rf .build
          mkdir -p .build
          git clone --no-tags --filter=blob:none https://github.com/MmDZ21/t3vox.git .build/t3vox
          cd .build/t3vox
          git checkout --detach 6ff59cac87ad2b384d2704e663004c7e10dce26d

      - name: Apply PTTConnect overlay
        shell: bash
        run: |
          python3 pttconnect/apply_overlay.py .build/t3vox
          python3 pttconnect/ui_upgrade.py .build/t3vox

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        shell: bash
        working-directory: .build/t3vox
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p out
          cp .build/t3vox/app/build/outputs/apk/debug/app-debug.apk out/PTTConnect-debug.apk
          sha256sum out/PTTConnect-debug.apk | tee out/PTTConnect-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PTTConnect-APK
          path: |
            out/PTTConnect-debug.apk
            out/PTTConnect-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
